# Локальный запуск KIROYA: docker compose up --build
name: kiroya

# Один образ для API, миграций и Celery; адреса сервисов — внутри docker-сети
x-backend-env: &backend-env
  build: ./backend
  image: kiroya-backend:local
  env_file: ./backend/.env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/2
    CELERY_RESULT_BACKEND: redis://redis:6379/3
    MINIO_ENDPOINT: minio:9000

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB — из того же .env, что и backend
    env_file: ./backend/.env
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500   # логировать запросы дольше 500 мс
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище фото. Консоль: http://localhost:9001
  # Образ minio/minio удалён с Docker Hub (2025) — берём сборку Chainguard того же MinIO
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD — из backend/.env
    env_file: ./backend/.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Одноразовый контейнер: накатывает миграции до старта API
  migrate:
    <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-env
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Фоновые задачи: автоотмена броней, напоминания, автоподтверждение возврата
  celery_worker:
    <<: *backend-env
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery_beat:
    <<: *backend-env
    restart: unless-stopped
    # Файл расписания — в /tmp: у пользователя app нет прав на запись в /app
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Мониторинг Celery: http://localhost:5555 (в проде — только за VPN / basic-auth)
  flower:
    <<: *backend-env
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    healthcheck:
      disable: true
    depends_on:
      - celery_worker

  # Telegram-бот. Нужен BOT_TOKEN в bot/.env; запуск: docker compose --profile bot up -d
  bot:
    build: ./bot
    image: kiroya-bot:local
    profiles: ["bot"]
    restart: unless-stopped
    env_file:
      - path: ./bot/.env
        required: false
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/4
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
